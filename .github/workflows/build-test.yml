name: build-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc
          - os: ubuntu-22.04
            preset: linux
          - os: macos-15
            preset: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke run (300 ticks, headless)
        shell: bash
        run: |
          bin=$(find build -type f \( -name "sillage-engine" -o -name "sillage-engine.exe" \) | head -1)
          "$bin" --ticks 300 --headless
