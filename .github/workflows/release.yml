name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc
          - os: ubuntu-22.04
            preset: linux
          - os: macos-15
            preset: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, test
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      - name: Package portable
        shell: bash
        run: |
          cd build/${{ matrix.preset }}
          cpack -C Release
          ls sillage-*-portable-*

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DBinDir="${{ github.workspace }}\build\windows-msvc\engine\Release" `
            /DVersion="$version" `
            /O"${{ github.workspace }}\dist" `
            packaging\windows\sillage.iss

      # Checksums let a customer verify a download that is not code-signed yet.
      - name: Checksums
        shell: bash
        run: |
          mkdir -p dist
          cp build/${{ matrix.preset }}/sillage-*-portable-* dist/ 2>/dev/null || true
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum sillage-* > "SHA256SUMS-${{ matrix.preset }}.txt"
          else
            shasum -a 256 sillage-* > "SHA256SUMS-${{ matrix.preset }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.preset }}.txt"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Only the Windows job produces an installer; listing it unconditionally
          # made the other two jobs fail on a missing path.
          files: |
            dist/sillage-*-portable-*
            dist/SHA256SUMS-*.txt
            ${{ runner.os == 'Windows' && 'dist/sillage-setup-*.exe' || '' }}
          body: |
            Voir le [CHANGELOG](https://github.com/pymenvert/Sillage/blob/main/CHANGELOG.md).

            **Artefacts** : portable (zip/tar.gz) pour Windows, Linux et macOS (universel
            arm64 + Intel), et installeur Windows en un fichier.
            Les binaires ne sont pas encore signés — vérifiez les sommes `SHA256SUMS-*.txt`.
