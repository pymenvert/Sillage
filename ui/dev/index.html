<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillage</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: rgba(17, 23, 33, 0.82);
    --line: #1e2733;
    --text: #d6e2f0;
    --dim: #5c6b7f;
    --accent: #38e1ff;
    --warn: #ffb347;
    --bad: #ff5d73;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Inter", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #scene.dragging { cursor: grabbing; }

  .glass {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }

  header {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; align-items: center; gap: 18px;
    padding: 10px 16px;
    z-index: 10;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  header h1 span { color: var(--accent); font-weight: 400; }
  .hstat { display: flex; align-items: baseline; gap: 6px; color: var(--dim); }
  .hstat b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  #conn { margin-left: auto; color: var(--dim); }
  #conn.live { color: var(--accent); }
  #conn.live::before {
    content: "●"; margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }

  aside {
    position: absolute; top: 72px; right: 14px; width: 240px;
    max-height: calc(100% - 100px);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 10;
  }
  section { padding: 12px 14px; }
  section h2 {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim);
    margin-bottom: 8px;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-variant-numeric: tabular-nums;
  }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .row .grow { flex: 1; }
  .row .dim { color: var(--dim); font-size: 12px; }
  .ok { color: #7cffa0; } .bad { color: var(--bad); }
  #tracklist { overflow-y: auto; max-height: 40vh; scrollbar-width: thin; }
  #learn-banner {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 14px 26px; z-index: 5; color: var(--warn);
    font-size: 14px; letter-spacing: 0.05em; display: none;
  }
  footer {
    position: absolute; bottom: 12px; left: 14px;
    padding: 6px 12px; color: var(--dim); font-size: 11px; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="glass">
  <h1>SILLAGE <span>engine</span></h1>
  <div class="hstat"><span>personnes</span><b id="h-tracks">–</b></div>
  <div class="hstat"><span>tick</span><b id="h-tick">–</b><span>ms</span></div>
  <div class="hstat"><span>points</span><b id="h-points">–</b></div>
  <div id="conn">connexion…</div>
</header>

<aside>
  <section class="glass" id="sensors-panel">
    <h2>Capteurs</h2>
    <div id="sensorlist"><div class="row dim">en attente…</div></div>
  </section>
  <section class="glass">
    <h2>Personnes</h2>
    <div id="tracklist"><div class="row dim">aucune</div></div>
  </section>
</aside>

<div id="learn-banner" class="glass">Apprentissage du fond — salle vide…</div>
<footer class="glass">molette : zoom · glisser : déplacer · double-clic : recadrer</footer>

<script>
"use strict";
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const el = (id) => document.getElementById(id);

const sensorColors = ["#38e1ff", "#ffb347", "#7cffa0", "#ff7ce8", "#c77dff", "#8ecae6"];
const trackColors = ["#ffd166", "#06d6a0", "#ef476f", "#8ecae6", "#c77dff", "#f4a261",
                     "#90e0ef", "#ffafcc"];

let frame = null;
let status = null;
const trails = new Map();

// --- View transform (pan / zoom) ---------------------------------------------
const view = { zoom: 1, panX: 0, panY: 0, fitted: false };
function fitView() {
  if (!frame) return;
  view.zoom = 1; view.panX = 0; view.panY = 0; view.fitted = true;
}
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  view.zoom = Math.min(8, Math.max(0.3, view.zoom * factor));
}, { passive: false });
let drag = null;
canvas.addEventListener("mousedown", (e) => {
  drag = { x: e.clientX, y: e.clientY };
  canvas.classList.add("dragging");
});
window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  view.panX += (e.clientX - drag.x) * devicePixelRatio;
  view.panY += (e.clientY - drag.y) * devicePixelRatio;
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("dblclick", fitView);

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
}
window.addEventListener("resize", resize);
resize();

// --- Data feeds ----------------------------------------------------------------
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { el("conn").textContent = "live"; el("conn").classList.add("live"); };
  ws.onclose = () => {
    el("conn").textContent = "reconnexion…"; el("conn").classList.remove("live");
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => {
    frame = JSON.parse(e.data);
    if (!view.fitted) fitView();
    for (const t of frame.tracks) {
      if (!trails.has(t.id)) trails.set(t.id, []);
      const trail = trails.get(t.id);
      trail.push({ x: t.x, y: t.y });
      if (trail.length > 90) trail.shift();
    }
    const live = new Set(frame.tracks.map((t) => t.id));
    for (const id of trails.keys()) if (!live.has(id)) trails.delete(id);
    updatePanels();
  };
}
connect();

async function pollStatus() {
  try {
    const r = await fetch("/api/status");
    if (r.ok) { status = await r.json(); updateSensors(); }
  } catch { /* engine restarting */ }
  setTimeout(pollStatus, 2000);
}
pollStatus();

// --- Panels ---------------------------------------------------------------------
function updatePanels() {
  if (!frame) return;
  el("h-tracks").textContent = frame.tracks.length;
  el("h-points").textContent = frame.points.length;
  if (frame.health) {
    el("h-tick").textContent = frame.health.tickMs.toFixed(1);
    el("learn-banner").style.display = frame.health.learning ? "block" : "none";
  }
  const list = el("tracklist");
  if (frame.tracks.length === 0) {
    list.innerHTML = '<div class="row dim">aucune</div>';
    return;
  }
  list.innerHTML = frame.tracks.map((t) => {
    const c = trackColors[t.id % trackColors.length];
    const speed = Math.hypot(t.vx, t.vy).toFixed(2);
    const state = t.coast ? '<span class="dim">occulté</span>' : `${speed} m/s`;
    return `<div class="row"><span class="swatch" style="background:${c}"></span>` +
           `<span class="grow">#${t.id}</span><span class="dim">${state}</span></div>`;
  }).join("");
}

function updateSensors() {
  if (!status) return;
  el("sensorlist").innerHTML = status.sensors.map((s) => {
    const c = sensorColors[s.id % sensorColors.length];
    const state = s.connected
      ? `<span class="ok">${s.fps.toFixed(0)} Hz</span>`
      : '<span class="bad">déconnecté</span>';
    return `<div class="row"><span class="swatch" style="background:${c}"></span>` +
           `<span class="grow">${s.type} ${s.id}</span>${state}</div>`;
  }).join("");
}

// --- Scene rendering --------------------------------------------------------------
function draw() {
  requestAnimationFrame(draw);
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = "#0a0e14";
  ctx.fillRect(0, 0, w, h);
  if (!frame) return;

  const [rw, rh] = frame.room;
  const margin = 70 * devicePixelRatio;
  const scale = Math.min((w - 2 * margin) / rw, (h - 2 * margin) / rh) * view.zoom;
  const ox = (w - rw * scale) / 2 + view.panX;
  const oy = (h + rh * scale) / 2 + view.panY;
  const X = (x) => ox + x * scale;
  const Y = (y) => oy - y * scale;

  // Metric grid + room outline.
  ctx.strokeStyle = "#131a24";
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= rw; gx += 1) {
    ctx.beginPath(); ctx.moveTo(X(gx), Y(0)); ctx.lineTo(X(gx), Y(rh)); ctx.stroke();
  }
  for (let gy = 0; gy <= rh; gy += 1) {
    ctx.beginPath(); ctx.moveTo(X(0), Y(gy)); ctx.lineTo(X(rw), Y(gy)); ctx.stroke();
  }
  ctx.strokeStyle = "#2a3646";
  ctx.lineWidth = 2;
  ctx.strokeRect(X(0), Y(rh), rw * scale, rh * scale);

  // Sensors: position + heading tick.
  (frame.sensors || []).forEach(([sx, sy, st], i) => {
    const c = sensorColors[i % sensorColors.length];
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(X(sx), Y(sy), 5 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    ctx.moveTo(X(sx), Y(sy));
    ctx.lineTo(X(sx + 0.5 * Math.cos(st)), Y(sy + 0.5 * Math.sin(st)));
    ctx.stroke();
  });

  // Foreground points, colored per sensor.
  for (const [px, py, s] of frame.points) {
    ctx.fillStyle = sensorColors[s % sensorColors.length];
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(X(px), Y(py), 1.6 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Trails (comet fade) + tracks.
  for (const t of frame.tracks) {
    const color = trackColors[t.id % trackColors.length];
    const trail = trails.get(t.id) || [];
    for (let i = 1; i < trail.length; i++) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = (i / trail.length) * 0.5;
      ctx.lineWidth = 2 * devicePixelRatio * (i / trail.length);
      ctx.beginPath();
      ctx.moveTo(X(trail[i - 1].x), Y(trail[i - 1].y));
      ctx.lineTo(X(trail[i].x), Y(trail[i].y));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.setLineDash(t.coast ? [4 * devicePixelRatio, 4 * devicePixelRatio] : []);
    ctx.beginPath();
    ctx.arc(X(t.x), Y(t.y), Math.max(t.r, 0.15) * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(X(t.x), Y(t.y));
    ctx.lineTo(X(t.x + t.vx * 0.6), Y(t.y + t.vy * 0.6));
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.font = `${12 * devicePixelRatio}px "JetBrains Mono", monospace`;
    ctx.fillText(`#${t.id}`, X(t.x) + 10 * devicePixelRatio, Y(t.y) - 10 * devicePixelRatio);
  }
}
draw();
</script>
</body>
</html>
